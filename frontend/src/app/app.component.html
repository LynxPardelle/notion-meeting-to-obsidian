<main class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">N/O</span>
      <div>
        <h1>Meeting Notes</h1>
        <p>Notion to Obsidian</p>
      </div>
    </div>

    <div class="sidebar-actions">
      <button type="button" (click)="sync()" [disabled]="busy()">Sync</button>
      <button type="button" class="secondary" (click)="refreshNotes()" [disabled]="busy()">Refresh</button>
    </div>

    <div class="theme-control" aria-label="Theme preference">
      <button type="button" [class.active]="isThemeSelected('light')" (click)="setThemePreference('light')">Claro</button>
      <button type="button" [class.active]="isThemeSelected('dark')" (click)="setThemePreference('dark')">Oscuro</button>
    </div>

    <nav class="note-list" aria-label="Synced notes">
      <button
        type="button"
        *ngFor="let note of visibleNotes()"
        [class.active]="note.path === selectedPath()"
        [class.child]="noteDepth(note) > 0"
        [style.--depth-offset]="treeIndent(note)"
        (click)="openNote(note)">
        <span class="node-spacer" *ngIf="!hasChildren(note)" aria-hidden="true"></span>
        <span
          class="tree-toggle"
          *ngIf="hasChildren(note)"
          role="button"
          tabindex="0"
          [attr.aria-label]="isCollapsed(note) ? 'Expand note group' : 'Collapse note group'"
          [attr.aria-expanded]="!isCollapsed(note)"
          (click)="toggleCollapsed(note, $event)"
          (keydown.enter)="toggleCollapsed(note, $event)"
          (keydown.space)="toggleCollapsed(note, $event)">
          {{ isCollapsed(note) ? '▸' : '▾' }}
        </span>
        <span class="note-content">
          <span class="note-parent" *ngIf="noteDepth(note) > 0">{{ note.parent }}</span>
          <span class="note-name">{{ note.name }}</span>
        </span>
      </button>
    </nav>
  </aside>

  <section class="workspace">
    <header class="toolbar">
      <div>
        <p class="eyebrow">Current note</p>
        <h2>{{ selectedName() }}</h2>
      </div>
      <div class="toolbar-actions">
        <span class="status">{{ status() }}</span>
        <button type="button" (click)="save()" [disabled]="busy() || !selectedPath()">Save</button>
      </div>
    </header>

    <div class="editor-grid">
      <section class="pane">
        <div class="pane-header">Markdown</div>
        <textarea
          [ngModel]="markdown()"
          (ngModelChange)="updateMarkdown($event)"
          spellcheck="false"
          aria-label="Markdown editor"></textarea>
      </section>

      <section class="pane preview">
        <div class="pane-header">Preview</div>
        <article [innerHTML]="preview()"></article>
      </section>
    </div>
  </section>
</main>
