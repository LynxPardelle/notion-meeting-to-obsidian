services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      OBSIDIAN_VAULT_PATH: /vault
      OBSIDIAN_MEETINGS_FOLDER: ${OBSIDIAN_MEETINGS_FOLDER:-Meetings}
      SYNC_STATE_PATH: /vault/.notion-meeting-sync/state.json
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - type: bind
        source: ${HOST_OBSIDIAN_VAULT_PATH:-./vault}
        target: /vault

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:47863:8080"
